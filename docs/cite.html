<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Citation map</title>
<meta name="description" content="Every in-text citation in a paper, mapped to its reference.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='5' fill='%23A3232B'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23465061' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="assets/style.css?v=f22e70082e">
<link rel="stylesheet" href="assets/cite.css?v=b613dd1252">
</head>
<body class="cite-page">

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <div class="eyebrow" id="stamp">citation map</div>
      <h1 id="paper-title">Citation map</h1>
      <p class="stats" id="stats"></p>
    </div>
    <a class="search-btn back" href="index.html">← Paper Read Atlas</a>
  </div>
</header>

<main class="wrap">
  <p class="missing" id="loading">Loading the citation map…</p>

  <section class="cite-view" id="view" hidden>
    <div class="view-head">
      <div class="seg tabs" role="tablist" aria-label="Citation views" id="tabs">
        <button type="button" role="tab" data-v="sub" aria-selected="true">Subsections → Papers</button>
        <button type="button" role="tab" data-v="theme" aria-selected="false">Sections → Themes</button>
        <button type="button" role="tab" data-v="table" aria-selected="false">Reference table</button>
      </div>
      <p class="note" id="note"></p>
    </div>

    <div class="gwrap" id="gwrap">
      <svg class="g" id="graph" role="img" aria-label="Which part of the paper cites which reference"></svg>
    </div>

    <div class="tbl-wrap" id="tablewrap" hidden>
      <table class="rt">
        <thead id="rt-head"><tr>
          <th data-sort="num" aria-sort="none"><button type="button" class="th-btn">[Number]</button></th>
          <th>Keyword</th>
          <th>Full title</th>
          <th>Year</th>
          <th data-sort="count" aria-sort="descending"><button type="button" class="th-btn">Times cited</button></th>
        </tr></thead>
        <tbody id="rt-body"></tbody>
      </table>
    </div>
  </section>
</main>

<aside class="dock" id="dock" aria-live="polite" hidden></aside>

<script src="assets/cite.js?v=0eccfc6980"></script>
</body>
</html>
