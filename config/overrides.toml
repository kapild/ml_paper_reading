# Per-paper fixes for Paper Read Atlas.
#
# Each line under [papers] is keyed by the paper's Name exactly as it appears in Notion
# (spacing and punctuation are ignored). Fields you can set:
#   short   = "BST"        label used in charts (default: text before the first colon)
#   title   = "..."        full title to show (useful when the Notion Name is a URL)
#   theme   = "seq"        one of the keys in config/themes.toml (beats the tag rules)
#   year    = 2020         publication year (beats the arXiv ID and the Year column)
#   org     = "Google"     organisation (beats the Company column)
#   exclude = true         leave this row out of the site
#
# The build lists overrides that no longer match a Name, e.g. after a rename in Notion.

# Company names to tidy up everywhere.
[org_aliases]
"Open AI" = "OpenAI"
"Facebook" = "Meta"
"Esty" = "Etsy"

