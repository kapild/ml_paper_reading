# Lines on the Lineages tab.
#
# Each [[line]] has a name and its stations. A station can be a paper's short name
# (as shown on the site), its full title, or its arXiv ID. Stations are placed by
# publication date, so their order here doesn't matter.
#
# The build prints suggested new lines from your links; copy the ones you want here.

[[line]]
name = "Lifelong user interest"
stations = ["DIN", "SIM", "TWIN", "TWIN V2"]

[[line]]
name = "Feature crossing"
stations = ["DCN", "DCN V2", "DHEN", "Pinterest Feature Interactions"]

[[line]]
name = "Self-attention for sequences"
stations = ["SASRec", "BERT4Rec", "BST", "TransAct"]

[[line]]
name = "Text → generative retrieval"
stations = ["Transformer", "BERT", "T5", "DSI", "TIGER", "PLUM"]

[[line]]
name = "Embedding-based retrieval"
stations = ["YouTube DNN", "Airbnb Search Embeddings", "Mixed Negative Sampling", "JD Semantic Retrieval", "EBR @ Facebook Search", "EBR Friend Recs", "Inverted-Index Retrieval"]

[[line]]
name = "Graph embeddings"
stations = ["DeepWalk", "node2vec", "GraphSAGE", "PinSage", "LiGNN"]
